  <script>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    function disparar() {
      const line = document.getElementById('glitchLine');
      const burst = document.getElementById('glitchBurst');
      document.body.classList.add('glitching');
      if (line) { line.classList.remove('active'); void line.offsetWidth; line.classList.add('active'); }
      if (burst) { burst.classList.remove('active'); void burst.offsetWidth; burst.classList.add('active'); }
      setTimeout(() => document.body.classList.remove('glitching'), 420);
    }
    function loop() { disparar(); setTimeout(loop, 10000 + Math.random() * 12000); }
    setTimeout(loop, 5000 + Math.random() * 4000);
  });
</script>
